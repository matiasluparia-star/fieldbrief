name: Build Hormuz Short
on:
  push:
    branches: [pulsocut-deploy]
    paths: ['.github/workflows/hormuz-render.yml']

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -U yt-dlp
      - name: Download source media
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work
          cd work
          yt-dlp --no-playlist --merge-output-format mp4 -o 'map.%(ext)s' 'https://share.descript.com/view/WZVRGD5jUqx'
          yt-dlp --no-playlist --merge-output-format mp4 -o 'tanker.%(ext)s' 'https://share.descript.com/view/r3ja061sQMg'
          yt-dlp --no-playlist --merge-output-format mp4 -o 'doha.%(ext)s' 'https://share.descript.com/view/WY1WBqc9nln'
          yt-dlp --no-playlist --merge-output-format mp4 -o 'hours48.%(ext)s' 'https://share.descript.com/view/Wygyb5qwPVc'
          yt-dlp --no-playlist --merge-output-format mp4 -o 'end.%(ext)s' 'https://share.descript.com/view/KEjG0SVMYW7'
          yt-dlp --no-playlist -x --audio-format m4a -o 'voice.%(ext)s' 'https://share.descript.com/view/iZtZw88zFNm'
          yt-dlp --no-playlist -x --audio-format m4a -o 'music.%(ext)s' 'https://share.descript.com/view/kC1tnBmzbYI'
          ls -lh
      - name: Normalize names
        shell: bash
        run: |
          set -euxo pipefail
          cd work
          mv "$(ls map.* | head -1)" map.mp4
          mv "$(ls tanker.* | head -1)" tanker.mp4
          mv "$(ls doha.* | head -1)" doha.mp4
          mv "$(ls hours48.* | head -1)" hours48.mp4
          mv "$(ls end.* | head -1)" end.mp4
          mv "$(ls voice.* | head -1)" voice.m4a
          mv "$(ls music.* | head -1)" music.m4a
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voice.m4a
      - name: Render final MP4
        shell: bash
        run: |
          set -euxo pipefail
          cd work
          DUR=38.817959
          ffmpeg -y \
            -i map.mp4 -i tanker.mp4 -i doha.mp4 -i hours48.mp4 -i end.mp4 \
            -i voice.m4a -stream_loop -1 -i music.m4a \
            -filter_complex "\
            [0:v]trim=0:3,setpts=PTS-STARTPTS,scale=850:1512,crop=720:1280:x='65+20*sin(t*0.8)':y='110+25*cos(t*0.7)',fps=30[v0];\
            [1:v]trim=0:3,setpts=PTS-STARTPTS,scale=860:1529,crop=720:1280:x='80+25*cos(t*0.9)':y='120+20*sin(t*0.8)',fps=30[v1];\
            [0:v]trim=2:5,setpts=PTS-STARTPTS,scale=880:1564,crop=720:1280:x='95+30*sin(t*0.6)':y='135+35*sin(t*0.5)',fps=30[v2];\
            [2:v]trim=0:1,setpts=PTS-STARTPTS,tpad=stop_mode=clone:stop_duration=2,scale=720:1280,fps=30[v3];\
            [0:v]trim=4:7,setpts=PTS-STARTPTS,scale=900:1600,crop=720:1280:x='110+35*cos(t*0.65)':y='150+25*sin(t*0.75)',fps=30[v4];\
            [1:v]trim=2:5,setpts=PTS-STARTPTS,scale=900:1600,crop=720:1280:x='110+25*sin(t*0.85)':y='150+30*cos(t*0.6)',fps=30[v5];\
            [3:v]trim=0:1,setpts=PTS-STARTPTS,tpad=stop_mode=clone:stop_duration=2,scale=720:1280,fps=30[v6];\
            [0:v]trim=1:4,setpts=PTS-STARTPTS,scale=870:1547,crop=720:1280:x='75+20*cos(t*0.7)':y='130+30*sin(t*0.65)',fps=30[v7];\
            [1:v]trim=0:3,setpts=PTS-STARTPTS,scale=880:1564,crop=720:1280:x='100+30*cos(t*0.75)':y='140+20*sin(t*0.9)',fps=30[v8];\
            [0:v]trim=5:8,setpts=PTS-STARTPTS,scale=920:1636,crop=720:1280:x='120+35*sin(t*0.55)':y='170+35*cos(t*0.55)',fps=30[v9];\
            [1:v]trim=3:6,setpts=PTS-STARTPTS,scale=920:1636,crop=720:1280:x='115+35*sin(t*0.7)':y='175+25*cos(t*0.7)',fps=30[v10];\
            [0:v]trim=0:2.5,setpts=PTS-STARTPTS,scale=860:1529,crop=720:1280:x='70+25*sin(t*0.9)':y='125+25*cos(t*0.8)',fps=30[v11];\
            [4:v]trim=0:1,setpts=PTS-STARTPTS,tpad=stop_mode=clone:stop_duration=2.317959,scale=720:1280,fps=30[v12];\
            [v0][v1][v2][v3][v4][v5][v6][v7][v8][v9][v10][v11][v12]concat=n=13:v=1:a=0[v];\
            [5:a]atrim=0:${DUR},asetpts=PTS-STARTPTS[voice];\
            [6:a]atrim=0:${DUR},asetpts=PTS-STARTPTS,volume=0.09[music];\
            [voice][music]amix=inputs=2:duration=first:dropout_transition=2[a]" \
            -map '[v]' -map '[a]' -t "$DUR" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 192k -movflags +faststart PulsoGlobal_003_Hormuz_FINAL.mp4
      - name: Verify duration and extract QC frames
        shell: bash
        run: |
          set -euxo pipefail
          cd work
          ffprobe -v error -show_streams -show_format PulsoGlobal_003_Hormuz_FINAL.mp4 > ffprobe.txt
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 PulsoGlobal_003_Hormuz_FINAL.mp4 | tee duration.txt
          for t in 5 10 20 30 38; do ffmpeg -y -ss "$t" -i PulsoGlobal_003_Hormuz_FINAL.mp4 -frames:v 1 "qc_${t}.jpg"; done
      - name: Upload final and QC
        uses: actions/upload-artifact@v4
        with:
          name: Hormuz-final
          path: |
            work/PulsoGlobal_003_Hormuz_FINAL.mp4
            work/ffprobe.txt
            work/duration.txt
            work/qc_5.jpg
            work/qc_10.jpg
            work/qc_20.jpg
            work/qc_30.jpg
            work/qc_38.jpg
          if-no-files-found: error
          retention-days: 7
